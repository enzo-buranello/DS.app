<style>
  body {
    font:
      12px/1.45 Inter,
      system-ui,
      sans-serif;
    margin: 0;
    padding: 14px;
    color: var(--figma-color-text, #222);
    background: var(--figma-color-bg, #fff);
  }
  h1 {
    font-size: 14px;
    margin: 0 0 4px;
  }
  p {
    margin: 4px 0;
    color: var(--figma-color-text-secondary, #666);
  }
  label {
    display: block;
    margin: 6px 0 2px;
    font-weight: 600;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 6px;
    border: 1px solid var(--figma-color-border, #ccc);
    border-radius: 4px;
    background: transparent;
    color: inherit;
    font: inherit;
  }
  button {
    margin: 6px 6px 0 0;
    padding: 6px 10px;
    border-radius: 5px;
    border: 1px solid var(--figma-color-border, #ccc);
    background: transparent;
    color: inherit;
    cursor: pointer;
    font: inherit;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  #status {
    margin-top: 10px;
    padding: 8px;
    border-radius: 5px;
    background: var(--figma-color-bg-secondary, #f5f5f5);
    white-space: pre-wrap;
    min-height: 18px;
  }
  #status.err {
    background: #fde8e8;
    color: #9b1c1c;
  }
</style>

<h1>DS-Studio Bridge</h1>
<p>Lien entre ce fichier Figma et DS-Studio sur votre Mac.</p>

<label for="pair">Code d’appairage (affiché dans DS-Studio)</label>
<input id="pair" autocomplete="off" spellcheck="false" />
<label for="server">Adresse du serveur</label>
<input id="server" spellcheck="false" />
<button id="test">Enregistrer et tester</button>
<p id="live">Lien direct inactif.</p>
<p>
  Laissez ce plugin ouvert, puis exportez depuis DS-Studio avec le bouton «
  Exporter ».
</p>

<div id="status"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const status = (text, err) => {
    $('status').textContent = text;
    $('status').className = err ? 'err' : '';
  };
  const send = (msg) => parent.postMessage({ pluginMessage: msg }, '*');
  const base = () => $('server').value.replace(/\/+$/, '');
  async function call(route, body) {
    let res;
    try {
      res = await fetch(base() + '/plugin/figma/' + route, {
        method: body ? 'POST' : 'GET',
        headers: Object.assign(
          { Authorization: 'Bearer ' + $('pair').value.trim() },
          body ? { 'Content-Type': 'application/json' } : {},
        ),
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch (e) {
      throw new Error(
        'DS-Studio injoignable sur ' + base() + '. L’app est-elle lancée ?',
      );
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Erreur ' + res.status);
    return data;
  }

  // Lien direct : tant que le plugin est ouvert, DS-Studio voit le fichier et
  // ses pages, et lui transmet les exports demandés par un clic.
  const replies = {};
  let seq = 0;
  const ask = (msg) =>
    new Promise((resolve) => {
      const rid = ++seq;
      replies[rid] = resolve;
      send(Object.assign({ rid }, msg));
    });
  async function liveLoop() {
    let delay = 1000;
    if ($('pair').value.trim()) {
      try {
        const info = await ask({ type: 'live-info' });
        const r = await call('live', info.data);
        $('live').textContent = 'Lien direct actif avec DS-Studio.';
        if (r.command) {
          status('Commande DS-Studio en cours…');
          const res = await ask({ type: 'command', command: r.command });
          await call(
            'result',
            res.ok
              ? { id: r.command.id, ok: true, data: res.data }
              : {
                  id: r.command.id,
                  ok: false,
                  error: String(res.error).slice(0, 500),
                },
          );
          status(res.ok ? 'Commande DS-Studio terminée.' : res.error, !res.ok);
          delay = 50;
        }
      } catch (e) {
        $('live').textContent = 'Lien direct inactif : ' + e.message;
      }
    }
    setTimeout(liveLoop, delay);
  }

  $('test').onclick = async () => {
    send({
      type: 'save-settings',
      pair: $('pair').value.trim(),
      server: base(),
    });
    try {
      await call('ping');
      status('Connecté à DS-Studio.');
    } catch (e) {
      status(e.message, true);
    }
  };
  onmessage = async (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'reply') {
      const resolve = replies[msg.rid];
      delete replies[msg.rid];
      if (resolve) resolve(msg);
    } else if (msg.type === 'settings') {
      $('pair').value = msg.pair;
      $('server').value = msg.server;
      liveLoop();
    } else if (msg.type === 'progress') {
      status(msg.message);
    } else if (msg.type === 'error') {
      status(msg.message, true);
    }
  };
  send({ type: 'init' });
</script>
